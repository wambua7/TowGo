<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/a77ff0fe8d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme{
            --color-primary: #6dcefb;
            --color-secondary: #f0f9ff;
            --radius-card: 10px;
            --color-btn: #8eea24;
            --color-warning: #f44747;
        }
    </style>
</head>
<body>
    <header class="bg-primary flex justify-between m-3 items-center rounded-card">
       <img src="assets/towgo-logo.png" alt="a logo" class="w-20 h-20 rounded-full p-2">
       <ul class="flex gap-2 ">
            <li><a href="" class="bg-btn rounded-card p-2 mr-4 hover:bg-green-500 cursore-pointer" >Login</a></li>
            <li ><a href="" class="bg-btn rounded-card p-2 mr-4 hover:bg-green-500 cursor-pointer">Signup</a></li>

       </ul>
    </header>
    <div class="flex gap-4">
        <div class="m-3 w-3/4">
            <img src="assets/map.png" alt="a map" class=" rounded-card object-cover w-full h-screen overflow-hidden" >
        </div>
        <div class="items-center border rounded-card bg-gray-200 w-74 h-68 m-3">
            <h2 class="text-base/6 font-semibold text-center m-3">Live Feed</h2>
            <p class="ml-3 text-base">Tow Service Need</p>
            <p class="ml-3 text-base">Westlands</p>
            <button class="bg-orange-400 m-3 rounded-card p-2">Claim and Dispatch</button>
            <p class="ml-3 text-base">Mechanic Need</p>
            <p class="ml-3 text-base">Kahawa Sukari</p>
            <button class="bg-orange-400 m-3 rounded-card p-2">Claim and Dispatch</button>
        </div>
    </div>
    <h2 class="m-3 text-xl/6 font-semibold text-gray-900 items-center">Verified Standby Providers</h2>
  <div class="flex flex-wrap m-3 p-4 rounded-card bg-gray-300">
    <div class="w-1/2 p-2">
        <div class="border-2 border-gray-500 rounded-card p-2 ">
            <img src="assets/josh-mechanic.jpg" alt="a mechanic" class="rounded-full w-60 h-60 m-2">
            <p>Josh Mechanic</p>
            <button class="bg-btn p-2 mt-2 w-full rounded-card">Call Now</button>
        </div>
    </div>
    <div class="w-1/2 p-2">
        <div class="border-2 border-gray-500 rounded-card p-2">
            <img src="assets/tow-truck.jpeg" alt="a tow truck" class="rounded-full w-60 h-60 m-2">
            <p>Grogon Tow Company</p>
            <button class="bg-btn p-2 mt-2 w-full rounded-card">Call Now</button>
        </div>
    </div>
    <div class="w-1/2 p-2">
        <div class="border-2 border-gray-500 rounded-card p-2">
            <img src="assets/flatbed.jpg" alt="a tow truck" class="rounded-full w-60 h-60 m-2">
            <p>Sifa Towing Services</p>
            <button class="bg-btn p-2 mt-2 w-full rounded-card">Call Now</button>
        </div>
    </div>
    <div class="w-1/2 p-2">
        <div class="border-2 border-gray-500 rounded-card p-2">
            <img src="assets/mark-mechanic.jpg" alt="a mechanic" class="rounded-full w-60 h-60 m-2">
            <p>Mark Automotive Engineer</p>
            <button class="bg-btn p-2 mt-2 w-full rounded-card">Call Now</button>
        </div>
    </div>
</div>  
</body>
</html>

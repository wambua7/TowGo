<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://kit.fontawesome.com/a77ff0fe8d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme{
            --color-primary: #6dcefb;
            --color-secondary: #f0f9ff;
            --radius-card: 10px;
            --color-btn: #8eea24;
            --color-warning: #f44747;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-[url('assets/bg-image.jpg')] bg-cover">
        <div class="rounded-xl bg-gray-200/20 backdrop-blur-md h-72 w-80 border-2 hover:-translate-y-2 transition">
            <p class="text-center text-md m-3">Login to Get Started</p>
            <form action="#" method="post" class="m-3 text-center">
                <label for="email">Enter your email</label>
                <input type="email" name="email" id="email" required
                    class="border rounded-lg bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <label for="password">Enter your Password</label>
                <input type="password" name="password" id="password"
                    class="border rounded-lg bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <button type="submit" class="bg-btn rounded-card p-3 hover:bg-green-500 w-full"><a href="home.html">Login</a></button>
            </form>
            <p class="ml-2 text-md/6">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>
</body>
</html>

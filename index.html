<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A welcome page for the towgo services website ">
    <title>Welcome Page</title>
    <script src="https://kit.fontawesome.com/a77ff0fe8d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme{
            --color-primary: #6dcefb;
            --color-secondary: #f0f9ff;
            --radius-card: 10px;
            --color-btn: #8eea24;
            --color-warning: #f44747;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="peer sr-only">
    <div class="flex gap-2 bg-primary rounded-card m-5 justify-between items-center p-2">
       <img src="assets/towgo-logo.png" alt="a logo" class="w-20 h-20 rounded-card" loading="lazy">
       <nav>
            <ul class="flex gap-2 text-lg">
                <li><a href="home.html" class="rounded-card p-2 hover:bg-blue-500 cursor-pointer">Home</a></li>
                <li><a href="about.html" class="rounded-card p-2 hover:bg-blue-500 cursor-pointer">About</a></li>
                <li>
                    <label for="menu-toggle" aria-label="Toggle menu" class="rounded-card p-2 hover:bg-blue-500 cursor-pointer">
                        <i class="fa-solid fa-bars"></i>
                    </label>
                </li>
            </ul>
       </nav>
    </div>
    <div class="hidden peer-checked:block bg-secondary rounded-card m-5 mt-0 p-4 text-gray-900">
        <ul class="flex flex-col gap-3 text-lg">
            <li><a href="about.html">Browse our Services</a></li>
            <li><a href="">View our Mechanics</a></li>
            <li><a href="">View Listed Tow Companies</a></li>
        </ul>
    </div>
    <div class="flex gap-2 rounded-card m-5 p-2 text-gray-900">
        <div class="flex-1 p-4 bg-secondary items-center">
            <h2 class="uppercase text-lg text-center font-semibold mb-3">New Here? Worry not?</h2>
            <p class="text-md/6 mb-3">Sorts your needs in minutes and effortlessly</p>
            <img src="assets/towgo-banner.png" alt="a banner image" class="max-w-full h-auto" loading="lazy">
            <div class="flex justify-center">
                <a href="signup.html" class="bg-btn rounded-card p-3 mt-5 cursor-pointer hover:bg-green-500">Get Started</a>
            </div>
        </div>
    </div>

    <footer class="bg-black m-3 rounded-card text-white ">
        <div class="p-4">
            <ul class="flex gap-4">
                <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                <li><a href=""><i class="fa-brands fa-whatsapp"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
            </ul>
        </div>
        <p class="m-3">&copy;2026 All rights reserved.</p>
    </footer>
</body>
</html>

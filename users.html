<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Page</title>
    <script src="https://kit.fontawesome.com/a77ff0fe8d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme{
            --color-primary: #6dcefb;
            --color-secondary: #f0f9ff;
            --radius-card: 10px;
            --color-btn: #8eea24;
            --color-warning: #f44747;
        }
    </style>
</head>
<body class="bg-white text-black">

    <header class="m-3 flex items-center justify-between rounded-card bg-primary px-6 py-5 sm:px-8">
        <div class="flex items-center gap-4 sm:gap-6">
            <img src="assets/towgo-logo.png" alt="Towgo Services logo" class="h-16 w-16 rounded-full bg-slate-900 object-cover sm:h-20 sm:w-20" loading="lazy">
            <h1 class="text-2xl uppercase sm:text-4xl">Towgo Services</h1>
        </div>
        <nav class="flex items-center gap-6 text-sm font-medium sm:text-base">
            <a href="#" class="transition hover:text-white">Notifications</a>
            <a href="#" class="transition hover:text-white">Call Hotline</a>
        </nav>
    </header>

    <main class="mx-3 mt-6 space-y-6">
        
        <div class="flex flex-col gap-10 lg:flex-row">
            <div class="h-64 w-full overflow-hidden rounded-card bg-slate-900 sm:h-80 lg:w-3/5">
                <img src="assets/map.png" alt="Map of nearby mechanics and tow trucks" class="h-full w-full object-cover" loading="lazy">
            </div>

            <section class="w-full pt-2 lg:w-2/5 lg:pt-4">
                <h2 class="mb-8 text-center text-xl font-medium">What you Need?</h2>

                <div class="mx-auto grid max-w-md grid-cols-2 gap-6 sm:gap-8">
                    <div class="flex flex-col items-center rounded-card bg-secondary px-4 py-8 text-center">
                        <img src="assets/mark-mechanic.jpg" alt="Mechanic" class="mb-6 h-14 w-14 rounded-full object-cover" loading="lazy">
                        <p class="mb-3 text-sm">Mechanic</p>
                        <button type="button" class="w-full rounded-card bg-btn py-1.5 text-sm font-medium transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-btn/50">
                            Book Now
                        </button>
                    </div>

                    <div class="flex flex-col items-center rounded-card bg-secondary px-4 py-8 text-center">
                        <img src="assets/flatbed.jpg" alt="Tow Truck" class="mb-6 h-14 w-14 rounded-full object-cover" loading="lazy">
                        <p class="mb-3 text-sm">Tow Truck</p>
                        <button type="button" class="w-full rounded-card bg-btn py-1.5 text-sm font-medium transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-btn/50">
                            Book Now
                        </button>
                    </div>
                </div>
            </section>
        </div>
        <div class="your-custom-class">
            <section class="w-full max-w-md rounded-card bg-secondary px-6 py-5">
                <h2 class="mb-4 text-center text-base font-medium">Provide Details</h2>

                <form action="#" method="post" class="space-y-3">
                    <div class="flex items-center justify-between gap-4">
                        <label for="names" class="w-24 shrink-0">Name</label>
                        <input type="text" name="names" id="names" required
                               class="min-w-0 flex-1 rounded-card bg-white px-3 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div class="flex items-center justify-between gap-4">
                        <label for="phone" class="w-24 shrink-0">Phone</label>
                        <input type="tel" name="phone" id="phone" required
                               class="min-w-0 flex-1 rounded-card bg-white px-3 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div class="flex items-center justify-between gap-4">
                        <label for="location" class="w-24 shrink-0">Location</label>
                        <input type="text" name="location" id="location"
                               class="min-w-0 flex-1 rounded-card bg-white px-3 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div class="flex items-center justify-between gap-4">
                        <label for="payment" class="w-24 shrink-0">Payment</label>
                        <input type="text" name="payment" id="payment"
                               class="min-w-0 flex-1 rounded-card bg-white px-3 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>

                    <div class="flex justify-center pt-2">
                        <button class="rounded-card bg-btn px-5 py-1.5 text-sm font-medium transition hover:brightness-95 focus:outline-none focus:ring-2 focus:ring-btn/50">
                           <a href="home.html">Send SOS</a>
                        </button>
                    </div>
                </form>
            </section>
        </div>

    </main>
</body>
</html>

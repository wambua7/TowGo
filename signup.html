<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://kit.fontawesome.com/a77ff0fe8d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme{
            --color-primary: #6dcefb;
            --color-secondary: #f0f9ff;
            --radius-card: 10px;
            --color-btn: #8eea24;
            --color-warning: #f44747;
        }
    </style>
</head>
<body>
    <div class="flex p-5 justify-center items-center min-h-screen bg-[url('assets/bg-image.jpg')] bg-cover ">
        <div class="rounded-card border p-2">
            <p class=" font-bold text-lg/7 m-2 text-center text-slate-800">CREATE ACCOUNT</p>
            <form action="#" method="post">
                <label for="options" class="m-3">Choose your Profile</label>
                <input type="radio" name="user" id="user">User
                <input type="radio" name="user" id="user">Tow Company
                <input type="radio" name="user" id="user">Mechanic
                <br>
                <label for="fname" class="m-3">First Name</label>
                <input type="text" name="fname" id="fname" required class="border rounded-card bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <label for="lname" class="m-3">Last Name</label>
                <input type="text" name="lname" id="lname" required class="border rounded-card bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <label for="email" class="m-3">Email</label>
                <input type="email" name="email" id="email" placeholder="@example.com" class="border rounded-card bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <label for="password" class="m-3">Password</label>
                <input type="password" name="password" id="password" required class="border rounded-card bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <label for="listings" class="m-3">Company details/CV</label>
                <input type="text" name="listings" id="listings" class="border rounded-card bg-white m-3 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                <br>
                <div class="flex justify-center"><button type="subm" class="bg-btn p-2 hover:bg-green-500 cursor-pointer rounded-card w-full">Sign Up</button></div>
             
        </form>
        <p class="m-3">Have an account?<a href="login.html">Login</a></p>
        </div> 
    </div>     
</body>
</html>
